<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA04</title>
</head>

<body>
    <script>
        let i = 1;
        let soma = 0;

        do {
            if (i % 2 === 0) soma += i;
            i++;
        } while (i <= 200);

        alert("A soma dos pares até 200 é: " + soma);
    </script>
</body>

</html>
