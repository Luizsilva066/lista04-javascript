<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA04</title>
</head>

<body>
    <script>
        let i = 1;
        let soma = 0;

        do {
            let num = Number(prompt("Digite o " + i + "º número:"));
            soma += num;
            i++;
        } while (i <= 5);

        alert("A média é: " + (soma / 5));

    </script>
</body>

</html>
