<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA04</title>
</head>

<body>
    <script>
        let a = 0;
        let b = 1;
        let i = 1;

        alert(a);
        alert(b);

        do {
            let temp = a + b;
            alert(temp);
            a = b;
            b = temp;
            i++;
        } while (i <= 8);

    </script>
</body>
