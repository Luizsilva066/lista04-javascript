<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA04</title>
</head>

<body>
    <script>
        let i = 1;
        let maiores = 0;

        do {
            let idade = Number(prompt("Digite a idade " + i + ":"));
            if (idade >= 18) maiores++;
            i++;
        } while (i <= 10);

        alert("Quantidade de maiores de idade: " + maiores);

    </script>
</body>

</html>
