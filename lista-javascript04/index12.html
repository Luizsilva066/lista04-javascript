<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA04</title>
</head>

<body>
    <script>
        let n = Number(prompt("Digite um número:"));
        let fatorial = 1;
        let i = n;

        do {
            fatorial *= i;
            i--;
        } while (i > 0);

        alert("Fatorial de " + n + " = " + fatorial);

    </script>
</body>

</html>
