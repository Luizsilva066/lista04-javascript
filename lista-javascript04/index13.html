<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LISTA04</title>
</head>

<body>
    <script>
        let n = Number(prompt("Digite um número:"));
        let i = 1;
        let soma = 0;

        do {
            if (i % 3 === 0) soma += i;
            i++;
        } while (i <= n);

        alert("A soma dos múltiplos de 3 até " + n + " é: " + soma);

    </script>
</body>

</html>
